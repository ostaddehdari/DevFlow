[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-servermaster"
version = "0.3.0a1"
description = "DevFlow control registry and ServerMaster MCP with local execution continuity"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0", "rfc3339-validator==0.1.4", "mcp==1.30.0", "cryptography==50.0.2"]

[project.scripts]
devflow = "devflow_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
